name: Test, build and deliver container

on:
  push:
    branches: [main, feat/docker-cicd]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-test.txt -r requirements-i18n.txt
      - name: Compile and verify committed translations
        run: |
          python scripts/compile_translations.py
          git diff --exit-code -- locales
      - name: API, auth, migrations and language tests
        run: python -m unittest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --target runtime --tag expense-api:ci .
      - name: Smoke test actual image
        run: python3 scripts/container_smoke.py expense-api:ci
      - name: Save tested image
        run: docker save expense-api:ci -o expense-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image
          path: expense-image.tar
          retention-days: 3

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/docker-cicd' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-image
      - name: Publish the tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}/expense-api"
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker load -i expense-image.tar
          docker tag expense-api:ci "$IMAGE:sha-$COMMIT"
          docker push "$IMAGE:sha-$COMMIT"
          echo "Published $IMAGE:sha-$COMMIT" >> "$GITHUB_STEP_SUMMARY"
